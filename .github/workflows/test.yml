name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The integration embeds ildevice-homeassistant, which users install separately; test against its release.
      - uses: actions/checkout@v7
        with:
          repository: 3735943886/ildevice-homeassistant
          ref: 0cf34b1b5be28c8211b0c06358f668dbb35cccf5 # v0.1.1
          path: .ildevice-homeassistant
      - run: cp -r .ildevice-homeassistant/custom_components/ildevice custom_components/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["test"][0])')"
      - run: python -m pytest
