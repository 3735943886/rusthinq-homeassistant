name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pin in pyproject.toml.
          - ha: current
            python: "3.14"
            requirements: ""
          # The minimum in hacs.json. pycares as Home Assistant 2025.1 shipped it: a newer one leaves a thread
          # behind that the test harness of that release reports.
          - ha: "2025.1.3"
            python: "3.13"
            requirements: pytest-homeassistant-custom-component==0.13.204 pycares==4.5.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["test"]))' > requirements-test.txt
      - name: Override the Home Assistant pin
        if: matrix.requirements != ''
        run: |
          grep -v '^pytest-homeassistant-custom-component' requirements-test.txt > requirements-base.txt
          printf '%s\n' ${{ matrix.requirements }} >> requirements-base.txt
          mv requirements-base.txt requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest
